services:
  - type: web
    name: discover-bf
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    buildCommand: |
      docker build -t discover-bf .
      
    startCommand: |
      # Installer les dépendances
      composer install --no-interaction --no-dev --optimize-autoloader
      
      # Créer le dossier de stockage et les liens symboliques
      mkdir -p storage/framework/{sessions,views,cache}
      chmod -R 775 storage/
      
      # Créer les tables nécessaires
      php artisan migrate --force
      
      # Installer et builder les assets
      npm install && npm run build
      
      # Créer le dossier build s'il n'existe pas
      if [ ! -d "public/build" ]; then
        mkdir -p public/build
      fi
      
      # Optimiser le cache
      php artisan optimize:clear
      php artisan optimize
      php artisan view:cache
      php artisan event:cache
      
      # Démarrer le serveur web
      php artisan serve --host=0.0.0.0 --port=10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://${RENDER_EXTERNAL_HOSTNAME}
      - key: VITE_APP_URL
        value: https://${RENDER_EXTERNAL_HOSTNAME}
      - key: MIX_ASSET_URL
        value: https://${RENDER_EXTERNAL_HOSTNAME}
      - key: NODE_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      # Configuration de la base de données PostgreSQL
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: discover_bf_db
          property: connectionString.host
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        fromDatabase:
          name: discover_bf_db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: discover_bf_db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: discover_bf_db
          property: password
      # Configuration du cache
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file

databases:
  - name: discover_bf_db
    databaseName: discover_bf
    user: discover_bf_user
    plan: free